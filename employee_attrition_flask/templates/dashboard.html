<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dashboard - Employee Attrition Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <span class="navbar-brand">Welcome, {{ username }} ({{ role }})</span>
    <a href="{{ url_for('logout') }}" class="btn btn-outline-light">Logout</a>
  </div>
</nav>

<div class="container mt-4 col-md-6">
  <h3>Employee Attrition Prediction</h3>
  <form method="POST" class="mt-3">
    <div class="mb-3">
      <label>Age</label>
      <input type="number" name="age" class="form-control" min="18" max="60" required>
    </div>
    <div class="mb-3">
      <label>Distance From Home</label>
      <input type="number" name="distance" class="form-control" min="1" max="30" required>
    </div>
    <div class="mb-3">
      <label>Job Satisfaction</label>
      <select name="job_satisfaction" class="form-select" required>
        <option value="1">1 - Low</option>
        <option value="2">2</option>
        <option value="3" selected>3</option>
        <option value="4">4 - High</option>
      </select>
    </div>
    <div class="mb-3">
      <label>Years At Company</label>
      <input type="number" name="years_at_company" class="form-control" min="0" max="40" required>
    </div>
    <div class="mb-3">
      <label>Monthly Income</label>
      <input type="number" name="monthly_income" class="form-control" min="1000" max="20000" required>
    </div>
    <div class="mb-3">
      <label>OverTime</label>
      <select name="overtime" class="form-select" required>
        <option value="No" selected>No</option>
        <option value="Yes">Yes</option>
      </select>
    </div>
    <button type="submit" class="btn btn-success w-100">Predict Attrition</button>
  </form>

  {% if prediction %}
  <div class="alert mt-4 {% if prediction.startswith('Yes') %}alert-danger{% else %}alert-success{% endif %}" role="alert">
    <h4 class="alert-heading">Prediction Result</h4>
    <p><strong>{{ prediction }}</strong></p>
    <hr>
    <p>Probability: {{ probability }}</p>
  </div>
  {% endif %}
</div>

</body>
</html>
